display_information:
  name: claude-slack-bot
  description: Forwards Slack DMs to the local Claude Code CLI and replies with the output.
  background_color: "#1a1a1a"

features:
  bot_user:
    display_name: claude-slack-bot
    always_online: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - chat:write.customize
      - im:history
      - im:read
      - im:write

settings:
  event_subscriptions:
    bot_events:
      - message.im
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
